name: Docker Build and Run Scraper

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full repository
        uses: actions/checkout@v3

      - name: Build Docker image from subdirectory
        run: docker build -t vsl-scraper -f build_and_process/Dockerfile build_and_process/

      - name: Run scraper inside Docker
        run: docker run --rm -v ${{ github.workspace }}/build_and_process/app:/app/app vsl-scraper

      - name: Upload JSON output
        uses: actions/upload-artifact@v4
        with:
          name: vsl-json-output
          path: build_and_process/app/vietnamese_sign_language_videos.json
